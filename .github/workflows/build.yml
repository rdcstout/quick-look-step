name: Build and Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      package_candidate:
        description: Sign and notarize a candidate for installation testing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test and build from source
        run: |
          sw_vers
          rustup show
          xcodebuild -version
          make test-foxtrot xcodebuild
          codesign --verify --deep --strict build/Build/Products/Debug/QuickLookStep.app

  package:
    if: github.event_name == 'workflow_dispatch' && inputs.package_candidate
    needs: verify
    runs-on: macos-26
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build Rust from source
        run: make libfoxtrot_universal.a

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Archive and sign
        env:
          MACOS_DEVELOPMENT_TEAM: ${{ vars.MACOS_DEVELOPMENT_TEAM }}
        run: |
          : "${MACOS_DEVELOPMENT_TEAM:?Set MACOS_DEVELOPMENT_TEAM in the release environment}"
          xcodebuild \
            -project QuickLookStep/QuickLookStep.xcodeproj \
            -scheme QuickLookStep \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$PWD/build/QuickLookStep.xcarchive" \
            ARCHS=arm64 DEVELOPMENT_TEAM="$MACOS_DEVELOPMENT_TEAM" \
            archive

      - name: Package, notarize and staple
        env:
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
          APPSTORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          app_path="$PWD/build/QuickLookStep.xcarchive/Products/Applications/QuickLookStep.app"
          dmg_path="$PWD/build/QuickLookStep-macOS-arm64.dmg"
          umask 077
          key_path="$(mktemp "$RUNNER_TEMP/quicklookstep-notary.XXXXXXXX")"
          trap 'rm -f "$key_path"' EXIT
          printf '%s\n' "$APPSTORE_CONNECT_API_PRIVATE_KEY" > "$key_path"
          identity="$(security find-identity -v -p codesigning | awk '/Developer ID Application/ && !seen++ { print $2 }')"
          bash scripts/package-macos.sh "$app_path" "$dmg_path" "$identity"
          xcrun notarytool submit "$dmg_path" --key "$key_path" \
            --key-id "$APPSTORE_CONNECT_API_KEY_ID" \
            --issuer "$APPSTORE_CONNECT_API_ISSUER_ID" --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
          hdiutil verify "$dmg_path"

      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: QuickLookStep
          path: build/QuickLookStep-macOS-arm64.dmg
          if-no-files-found: error
